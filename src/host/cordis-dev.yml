# 开发期挂载覆盖层（**不进分发包**）
#
# 用法：
#   npx --yes @deepseek-ai/dsh@0.1.5-rc.1 --profile web \
#     --patch "L:/Toolfolk for DSH/src/host/cordis-dev.yml" --port 3081 --no-open
#
# 为什么不用包内的 cordis.patch.yml：那份是发行形态，用**包名**引用、靠 profile 的
# node_modules 解析；开发仓库里没有装这个包，解析不到，所以开发期必须用绝对路径。
#
# 两行：
#   toolfolk-for-dsh  —— 包的宿主入口（状态桥接，发行时也是它）
#   studio-graph-check—— 仅开发用：打印客户端启动图，确认 bundle 行被编入

- insert:
    - id: toolfolk-for-dsh
      name: 'L:/Toolfolk for DSH/src/host.mjs'
    - id: studio-graph-check
      name: 'L:/Toolfolk for DSH/src/host/client-graph-check.mjs'
